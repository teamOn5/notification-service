name: Deploy (prod) with ec2-instance

on:
  push:
    branches: [ "main" ]

env:
  SERVICE_NAME: notification-service

permissions:
  contents: read
  packages: read   # GitHub Packages(common-module) 의존성 다운로드용

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 코스 체크아웃
        uses: actions/checkout@v4

      - name: 2. JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Gradle 권한 부여 및 빌드
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test

      - name: 4. Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 5. Docker 이미지 빌드 및 푸시
        run: |
          IMAGE_NAME=${{ secrets.DOCKER_USERNAME }}/${{ env.SERVICE_NAME }}
          docker build -t $IMAGE_NAME:latest -t $IMAGE_NAME:${{ github.sha }} .
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}

      - name: 6. env 파일 생성 (지정한 키만)
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SPRING_DATASOURCE_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SPRING_DATASOURCE_USERNAME }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          SPRING_KAFKA_BOOTSTRAP_SERVERS: ${{ secrets.SPRING_KAFKA_BOOTSTRAP_SERVERS }}
          EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${{ secrets.EUREKA_CLIENT_SERVICEURL_DEFAULTZONE }}
        run: |
          umask 077
          KEYS="SPRING_DATASOURCE_URL SPRING_DATASOURCE_USERNAME SPRING_DATASOURCE_PASSWORD SPRING_KAFKA_BOOTSTRAP_SERVERS EUREKA_CLIENT_SERVICEURL_DEFAULTZONE"
          ENV_FILE="$SERVICE_NAME.env"
          : > "$ENV_FILE"
          for key in $KEYS; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "::error::Secret '$key' 가 등록되지 않았습니다."
              exit 1
            fi
            if [[ "$value" == *"'"* || "$value" == *$'\n'* ]]; then
              echo "::error::Secret '$key' 에 작은따옴표나 줄바꿈이 포함되어 있습니다."
              exit 1
            fi
            # 작은따옴표로 감싸 $ 등 특수문자가 compose에서 치환되지 않도록 함
            printf "%s='%s'\n" "$key" "$value" >> "$ENV_FILE"
          done

      - name: 7. env 파일 EC2 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 15.164.172.146
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ${{ env.SERVICE_NAME }}.env
          target: /home/ubuntu/infra-backend/env

      - name: 7-1. Runner의 env 파일 삭제
        if: always()
        run: rm -f ${{ env.SERVICE_NAME }}.env

      - name: 8. 백엔드 EC2 원격 자동 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 15.164.172.146
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/infra-backend
            chmod 600 env/${{ env.SERVICE_NAME }}.env
            curl -s -O https://raw.githubusercontent.com/teamOn5/infra/main/backend-server/docker-compose.apps.yml
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.apps.yml pull ${{ env.SERVICE_NAME }}
            docker compose -f docker-compose.apps.yml up -d --no-deps ${{ env.SERVICE_NAME }}
            docker image prune -f