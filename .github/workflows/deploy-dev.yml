name: Deploy (develop) with self hosted

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # GitHub Packages(common-module) 의존성 다운로드용

jobs:
  build-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: cmd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & Test with Gradle
        env:
          GITHUB_USERNAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gradlew.bat clean build --no-daemon

      - name: Create .env from GitHub Secrets
        shell: powershell
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          $exclude = @('github_token', 'EC2_SSH_KEY', 'DOCKER_PASSWORD')
          $secrets = $env:SECRETS_JSON | ConvertFrom-Json
          $lines = foreach ($p in $secrets.PSObject.Properties) {
            if ($exclude -contains $p.Name) { continue }
            $v = ([string]$p.Value).Replace('\', '\\').Replace('"', '\"').Replace("`r", '').Replace("`n", '\n')
            "$($p.Name)=`"$v`""
          }
          # UTF-8 (BOM 없음)으로 저장 - BOM이 있으면 첫 번째 키를 docker compose가 못 읽음
          $path = Join-Path (Get-Location) '.env'
          [System.IO.File]::WriteAllLines($path, [string[]]$lines, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "생성된 키 목록:"
          $lines | ForEach-Object { ($_ -split '=', 2)[0] }

      - name: Prepare Docker Network and Clean Existing Container
        run: |
          docker network create spharos 2>nul
          docker rm -f eureka 2>nul
          exit /b 0

      - name: Deploy Eureka with Docker Compose
        run: docker compose up -d --build

      - name: Verify Running Container
        run: docker compose ps